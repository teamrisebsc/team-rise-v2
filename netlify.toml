[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/run-skill"
  to = "/.netlify/functions/run-skill"
  status = 200

[[redirects]]
  from = "/api/pipeline"
  to = "/.netlify/functions/pipeline"
  status = 200

[[redirects]]
  from = "/api/skills"
  to = "/.netlify/functions/skills"
  status = 200

[[redirects]]
  from = "/api/recruit-pipeline"
  to = "/.netlify/functions/recruit-pipeline"
  status = 200

[[redirects]]
  from = "/api/recruit-step3"
  to = "/.netlify/functions/not-available"
  status = 200

[[redirects]]
  from = "/api/gx-stats"
  to = "/.netlify/functions/gx-stats"
  status = 200

[[redirects]]
  from = "/api/gx-sync"
  to = "/.netlify/functions/not-available"
  status = 200

[[redirects]]
  from = "/api/book-appointment"
  to = "/.netlify/functions/book-appointment"
  status = 200

[[redirects]]
  from = "/api/daily-report"
  to = "/.netlify/functions/daily-report"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
